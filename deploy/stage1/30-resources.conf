# Measured before deployment: API ~160 MiB cgroup / 181 MiB RSS, 7 tasks,
# ~0.1% CPU; host ~10 GiB available out of 11 GiB. One uvicorn worker.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=5
[Service]
MemoryAccounting=true
CPUAccounting=true
MemoryHigh=512M
MemoryMax=1G
CPUQuota=100%
TasksMax=64
LimitNOFILE=4096
LimitFSIZE=268435456
EnvironmentFile=/etc/alua/runtime-limits.env
Environment=TMPDIR=/tmp
TemporaryFileSystem=/tmp:rw,size=64M,mode=1777 /var/tmp:rw,size=64M,mode=1777
ReadOnlyPaths=/opt/alua
ProtectSystem=strict
ProtectHome=true
PrivateTmp=false
NoNewPrivileges=true
LogNamespace=alua
LogRateLimitIntervalSec=30s
LogRateLimitBurst=100
