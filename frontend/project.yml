name: Alua

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.2

targets:

  Alua:
    type: application
    platform: iOS

    sources:
      - path: Alua

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alua.app
        PRODUCT_NAME: Alua
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_API_BASE_URL: "$(API_BASE_URL)"
      configs:
        Debug:
          API_BASE_URL: http://127.0.0.1:8000
        Release:
          API_BASE_URL: https://api.alua.app

    dependencies:
      - target: AluaWidgets

      - package: Firebase
        product: FirebaseCore

      - package: Firebase
        product: FirebaseAuth

      - package: Firebase
        product: FirebaseMessaging


  AluaWidgets:
    type: app-extension
    platform: iOS

    sources:
      - path: AluaWidgets

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alua.app.widgets
        PRODUCT_NAME: AluaWidgets
        GENERATE_INFOPLIST_FILE: YES

        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
